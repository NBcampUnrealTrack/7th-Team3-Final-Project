<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="95%">
      <stop offset="0%" stop-color="#15191b"/>
      <stop offset="55%" stop-color="#0a0c0d"/>
      <stop offset="100%" stop-color="#050607"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </radialGradient>
    <pattern id="bars" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="none"/>
      <rect x="54" width="6" height="60" fill="#000000" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#bars)"/>
  <rect width="1920" height="1080" fill="url(#vig)"/>

  <rect x="0" y="0" width="1920" height="96" fill="#000000"/>
  <rect x="0" y="984" width="1920" height="96" fill="#000000"/>

  <g transform="translate(115,150)">
